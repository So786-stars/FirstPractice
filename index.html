<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First HTML Page</title>
</head>
<body>
  <h1>Welcome to My Website</h1>
  <p>This is a basic HTML5 structure.</p>
</body>


<!--
- <!DOCTYPE html>: Declares the document type and version (HTML5).
- <html lang="en">: Root element with language set to English.
- <head>: Contains metadata, title, and links to styles/scripts.
- <meta charset="UTF-8">: Ensures proper character encoding.
- <meta name="viewport" content="width=device-width, initial-scale=1.0">: Makes the page responsive on mobile devices.
- <title>: Sets the browser tab title.
- <body>: Contains the visible content of the page.

-->

</html>
